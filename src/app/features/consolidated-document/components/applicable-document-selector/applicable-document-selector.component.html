<section aria-labelledby="document-selector-title">
  <div class="document-list" role="radiogroup" aria-labelledby="document-selector-title">
    @for (document of documents(); track document.id) {
      <button type="button" class="document-card"
        [class.document-card--selected]="selectedDocumentId() === document.id"
        [class.document-card--disabled]="unavailableDocumentIds().has(document.id)"
        [attr.role]="'radio'"
        [attr.aria-checked]="selectedDocumentId() === document.id"
        [attr.aria-disabled]="unavailableDocumentIds().has(document.id)"
        [disabled]="unavailableDocumentIds().has(document.id)"
        (click)="documentSelected.emit(document.id)">
        <span class="document-icon" aria-hidden="true">{{ document.label.toLowerCase().includes('pan') ? '▤' : document.label.toLowerCase().includes('passport') ? '▣' : '▧' }}</span>
        <span class="document-card__body">
          <strong>{{ document.label }}</strong>
          <small>{{ document.required ? 'Mandatory' : 'Optional' }}</small>
          @if (unavailableDocumentIds().has(document.id)) {
            <small class="duplicate-message">Already uploaded in another category</small>
          }
        </span>
        @if (selectedDocumentId() === document.id) {
          <span class="selected-check" aria-hidden="true">✓</span>
        }
      </button>
    }
  </div>
</section>
