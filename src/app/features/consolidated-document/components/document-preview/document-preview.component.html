<section class="panel preview" aria-labelledby="preview-title">
  <h3 id="preview-title">Document preview</h3>
  @if (previewFile(); as file) {
    @if (file.type === 'image') {
      @if (imageEditorFiles().length) {
        <app-image-editor
          [imageFiles]="imageEditorFiles()"
          [showControls]="imageEditorControls"
          [maxCompressSizeInMb]="5"
          [useSampleImage]="false"
          [loadSampleOcr]="false" />
      } @else {
        <p class="empty-state" role="status">Preparing image preview…</p>
      }
    } @else {
      <iframe
        [src]="safePreviewUrl()"
        [title]="'PDF preview of ' + file.name"></iframe>
    }
  } @else {
    <p class="empty-state">Upload a file to preview it.</p>
  }
  @if (files().length > 1) {
    <div class="preview-selector" aria-label="Select preview file">
      @for (file of files(); track file.id) {
        <button mat-button type="button" [class.preview-selector__active]="previewFile()?.id === file.id"
          (click)="fileSelected.emit(file.id)">{{ file.name }}</button>
      }
    </div>
  }
</section>
