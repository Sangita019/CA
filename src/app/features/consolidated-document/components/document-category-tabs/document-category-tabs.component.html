<nav class="category-tabs" aria-label="Document categories" role="tablist">
  @for (tab of tabs(); track tab.id; let index = $index) {
    <button type="button" role="tab" class="category-tab"
      [class.category-tab--active]="selectedIndex() === index"
      [attr.aria-selected]="selectedIndex() === index"
      [attr.aria-controls]="'document-tab-panel-' + tab.id"
      (click)="tabSelected.emit(index)">
      <span>{{ tab.label }}</span>
      @if (selectedIndex() === index) {
        <span class="category-tab__dot" aria-hidden="true"></span>
      }
    </button>
  }
</nav>
